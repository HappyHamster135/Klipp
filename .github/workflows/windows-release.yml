name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (use a new version for a signed release)
        required: true
        default: '1.0.10'
        type: string
      sign:
        description: Request SignPath signing (requires prior Foundation approval and configuration)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HappyHamster135/Klipp' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Require Foundation approval before signing
        if: inputs.sign
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          if ($env:SIGNPATH_ENABLED -cne 'true') {
            throw 'SignPath signing is pending Foundation approval and repository configuration. Run an unsigned review build instead.'
          }
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.301'
      - name: Check out the pinned GitHub artifact action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.sign
        with:
          repository: actions/upload-artifact
          ref: cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          path: .signpath-tools/upload
          persist-credentials: false
      - name: Check out the pinned SignPath action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.sign
        with:
          repository: SignPath/github-action-submit-signing-request
          ref: c92b958760219087e01f8d67a1669ed57afe2627 # v2
          path: .signpath-tools/submit
          persist-credentials: false
      - name: Check signing orchestration
        run: node --test tools/signpath/signpath.test.cjs
        shell: pwsh
      - name: Run core checks
        run: dotnet test tests/Klipp.Tests/Klipp.Tests.csproj -c Release
        shell: pwsh
      - name: Check version-specific release notes
        run: powershell -NoProfile -File tools/Test-KlippReleaseNotes.ps1
        shell: pwsh
      - name: Check public publisher configuration and update payload validation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-KlippCommunityConfigurationChecks.ps1
        shell: pwsh
      - name: Prepare public community configuration
        shell: pwsh
        env:
          KLIPP_SUPABASE_URL: ${{ vars.KLIPP_SUPABASE_URL }}
          KLIPP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KLIPP_SUPABASE_PUBLISHABLE_KEY }}
          KLIPP_MEDIA_API_URL: ${{ vars.KLIPP_MEDIA_API_URL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/New-KlippCommunityConfiguration.ps1 -OutputPath backend/community.json -RequireOnlineConfiguration
      - name: Check Windows shortcut icon repair
        run: dotnet run --project tools/Klipp.ShortcutHarness/Klipp.ShortcutHarness.csproj -c Release
        shell: pwsh
      - name: Build review or signed candidate
        id: build
        uses: ./.github/actions/signpath-release
        with:
          version: ${{ inputs.version }}
          sign: ${{ inputs.sign }}
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
          SIGNPATH_POLICY: release-signing
          SIGNPATH_API_TOKEN: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN || '' }}
          SIGNPATH_GITHUB_TOKEN: ${{ inputs.sign && github.token || '' }}
      - name: Verify public configuration survives in the update payload
        shell: pwsh
        env:
          KLIPP_ARTIFACT_DIRECTORY: ${{ steps.build.outputs.artifact-directory }}
          KLIPP_CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $package = Join-Path $env:KLIPP_ARTIFACT_DIRECTORY ("HappyHamster135.Klipp-" + $env:KLIPP_CANDIDATE_VERSION + "-full.nupkg")
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/Test-KlippCommunityConfiguration.ps1 -ExpectedConfigurationPath backend/community.json -FullPackagePath $package
          if ($LASTEXITCODE -ne 0) { throw 'Public publisher configuration did not pass update payload verification.' }
      - name: Upload candidate for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.artifact-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
