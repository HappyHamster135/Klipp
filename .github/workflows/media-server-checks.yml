name: Media server security checks

on:
  pull_request:
    paths:
      - 'backend/Klipp.MediaServer/**'
      - 'backend/Klipp.MediaServer.Tests/**'
      - '.github/workflows/media-server-checks.yml'
  push:
    branches: [main]
    paths:
      - 'backend/Klipp.MediaServer/**'
      - 'backend/Klipp.MediaServer.Tests/**'
      - '.github/workflows/media-server-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-server-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the existing pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.301'
      - name: Ensure distro media tools are available
        id: media-tools
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # Bound repository stalls without changing package or TLS verification.
            apt_options=(
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
              -o DPkg::Lock::Timeout=20
            )
            sudo timeout --kill-after=15s 90s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=15s 120s apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          fi
          printf 'ffmpeg=%s\n' "$(command -v ffmpeg)" >> "$GITHUB_OUTPUT"
          printf 'ffprobe=%s\n' "$(command -v ffprobe)" >> "$GITHUB_OUTPUT"
      - name: Run media authentication, upload, playback and storage checks
        env:
          FFPROBE_PATH: ${{ steps.media-tools.outputs.ffprobe }}
          FFMPEG_PATH: ${{ steps.media-tools.outputs.ffmpeg }}
        run: >-
          dotnet run --project backend/Klipp.MediaServer.Tests/Klipp.MediaServer.Tests.csproj
          --configuration Release -- "$FFPROBE_PATH" "$FFMPEG_PATH"
