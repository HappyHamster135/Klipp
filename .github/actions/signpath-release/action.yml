name: Build a Klipp signing candidate
description: Runs packaging in a Node action so SignPath callbacks retain GitHub artifact credentials.
inputs:
  version:
    description: Release version
    required: true
  sign:
    description: Request approved SignPath release signing
    required: true
    default: 'false'
outputs:
  artifact-directory:
    description: Verified release assets, or unsigned review assets
  artifact-name:
    description: Artifact name identifying signing status
runs:
  using: node24
  main: index.cjs
