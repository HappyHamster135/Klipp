<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Klipp code</title>
  </head>
  <body style="margin:0;padding:32px 16px;background-color:#17191c;color:#e6e8eb;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" style="width:100%;max-width:480px;margin:0 auto;border-collapse:separate;border-spacing:0;">
      <tr>
        <td style="padding:28px;background-color:#202327;border:1px solid #3a3f46;border-radius:8px;">
          <table role="presentation" style="border-collapse:collapse;margin-bottom:28px;">
            <tr>
              <td style="width:32px;height:32px;background-color:#7198c7;border-radius:5px;color:#17191c;text-align:center;font-size:22px;font-weight:bold;">K</td>
              <td style="padding-left:10px;color:#e6e8eb;font-size:18px;font-weight:bold;">Klipp</td>
            </tr>
          </table>
          <h1 style="margin:0 0 12px;color:#e6e8eb;font-size:22px;line-height:1.35;">Your Klipp code</h1>
          <p style="margin:0 0 24px;color:#a7adb5;font-size:15px;line-height:1.6;">Enter this code in Klipp to continue:</p>
          <div style="padding:18px 12px;background-color:#17191c;border:1px solid #3a3f46;border-radius:5px;color:#e6e8eb;text-align:center;font-family:Consolas,Menlo,monospace;font-size:28px;font-weight:bold;letter-spacing:5px;white-space:nowrap;">{{ .Token }}</div>
          <p style="margin:20px 0 0;color:#a7adb5;font-size:13px;line-height:1.6;">Only enter this code in Klipp. If you didn’t request it, you can ignore this email.</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 12px;color:#929aa4;text-align:center;font-size:12px;line-height:1.5;">Klipp account verification</td>
      </tr>
    </table>
  </body>
</html>
